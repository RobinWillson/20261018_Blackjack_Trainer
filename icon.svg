<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcfaf7"/>
      <stop offset="50%" stop-color="#f2ebe0"/>
      <stop offset="100%" stop-color="#e6dbcd"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a66f43"/>
      <stop offset="100%" stop-color="#7c4f2a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8f4ee"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#5a412d" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.35"/>

  <!-- Left Card: A of Spades -->
  <g transform="translate(140, 240) rotate(-14)" filter="url(#shadow)">
    <rect x="-80" y="-120" width="160" height="240" rx="16" fill="url(#cardGrad)" stroke="#ded5c8" stroke-width="2"/>
    <text x="-62" y="-85" font-family="-apple-system, system-ui, sans-serif" font-weight="900" font-size="34" fill="#2b2019">A</text>
    <!-- Spade Pip -->
    <path d="M-62 -72 C-64 -66 -72 -63 -72 -57 C-72 -51 -66 -49 -62 -53 C-62 -51 -61 -48 -61 -47 L-63 -47 L-61 -47 C-61 -48 -62 -51 -62 -53 C-58 -49 -52 -51 -52 -57 C-52 -63 -60 -66 -62 -72 Z" fill="#2b2019" transform="scale(0.8) translate(-15, -15)"/>
    <!-- Center Big Spade -->
    <path d="M0 -45 C-18 -10 -48 10 -48 35 C-48 55 -28 65 0 45 C0 58 -10 75 -18 80 L18 80 C10 75 0 58 0 45 C28 65 48 55 48 35 C48 10 18 -10 0 -45 Z" fill="#2b2019"/>
  </g>

  <!-- Right Card: Jack of Diamonds / Blackjack -->
  <g transform="translate(330, 260) rotate(10)" filter="url(#shadow)">
    <rect x="-80" y="-120" width="160" height="240" rx="16" fill="url(#cardGrad)" stroke="#ded5c8" stroke-width="2"/>
    <text x="-64" y="-85" font-family="-apple-system, system-ui, sans-serif" font-weight="900" font-size="34" fill="#b83a2b">J</text>
    <!-- Center Diamond -->
    <polygon points="0,-45 42,0 0,45 -42,0" fill="#b83a2b"/>
  </g>

  <!-- 21 Badge in Gold -->
  <g transform="translate(256, 400)">
    <rect x="-90" y="-30" width="180" height="60" rx="30" fill="#ffffff" stroke="url(#goldGrad)" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="12" font-family="-apple-system, system-ui, sans-serif" font-weight="800" font-size="28" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">BLACKJACK</text>
  </g>
</svg>
